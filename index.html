<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puyo Puyo</title>
  <style>
    :root {
      --bg1: #1f3350;
      --bg2: #0f1728;
      --panel: rgba(255,255,255,.08);
      --shadow: rgba(0,0,0,.35);
      --text: #fff;
      --accent: #ffb703;
      --danger: rgba(255, 87, 87, .92);
      --board: #0e1522;
      --grid: rgba(255,255,255,.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2) 68%);
      color: var(--text);
    }
    #app {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .game-shell { width: min(920px, 100%); }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .topbar h1 { margin: 0; font-size: 2rem; letter-spacing: .04em; }
    button {
      background: var(--accent);
      color: #111;
      border: 0;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.2);
    }
    .layout {
      display: grid;
      grid-template-columns: auto 240px;
      gap: 24px;
      align-items: start;
    }
    .board-wrap {
      position: relative;
      width: fit-content;
    }
    canvas {
      image-rendering: pixelated;
      border-radius: 18px;
      box-shadow: 0 12px 32px var(--shadow);
      display: block;
    }
    .panel {
      display: grid;
      gap: 16px;
    }
    .panel section {
      background: var(--panel);
      padding: 16px;
      border-radius: 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
    }*
