<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puyo Puyo</title>
  <style>
    :root {
      --bg1: #1f3350;
      --bg2: #0f1728;
      --panel: rgba(255,255,255,.08);
      --shadow: rgba(0,0,0,.35);
      --text: #fff;
      --accent: #ffb703;
      --danger: rgba(255, 87, 87, .92);
      --board: #0e1522;
      --grid: rgba(255,255,255,.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2) 68%);
      color: var(--text);
    }
    #app {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .game-shell { width: min(920px, 100%); }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .topbar h1 { margin: 0; font-size: 2rem; letter-spacing: .04em; }
    button {
      background: var(--accent);
      color: #111;
      border: 0;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.2);
    }
    .layout {
      display: grid;
      grid-template-columns: auto 240px;
      gap: 24px;
      align-items: start;
    }
    .board-wrap {
      position: relative;
      width: fit-content;
    }
    canvas {
      image-rendering: pixelated;
      border-radius: 18px;
      box-shadow: 0 12px 32px var(--shadow);
      display: block;
    }
    .panel {
      display: grid;
      gap: 16px;
    }
    .panel section {
      background: var(--panel);
      padding: 16px;
      border-radius: 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
    }
    .panel h2 {
      margin: 0 0 8px;
      font-size: 1rem;
      opacity: .85;
      letter-spacing: .03em;
    }
    #score, #chain {
      font-size: 2rem;
      font-weight: 900;
      line-height: 1;
    }
    .help p {
      margin: 6px 0;
      opacity: .9;
    }
    .message {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--danger);
      font-weight: 900;
      text-align: center;
      letter-spacing: .03em;
    }
    .hidden { display: none; }
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      .panel { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const COLS = 6;
    const ROWS = 12;
    const CELL = 32;
    const COLORS = {
      red:    { fill: '#ff5a5f', stroke: '#b53035', eye: '#231f20', highlight: 'rgba(255,255,255,.55)' },
      blue:   { fill: '#4cc9f0', stroke: '#1b7ea5', eye: '#102033', highlight: 'rgba(255,255,255,.58)' },
      yellow: { fill: '#ffd166', stroke: '#c18b14', eye: '#332500', highlight: 'rgba(255,255,255,.55)' },
      purple: { fill: '#9b5de5', stroke: '#5f2ca3', eye: '#1d102b', highlight: 'rgba(255,255,255,.52)' },
      green:  { fill: '#2ec4b6', stroke: '#16756d', eye: '#0d241f', highlight: 'rgba(255,255,255,.53)' }
    };
    const COLOR_KEYS = Object.keys(COLORS);
    const DROP_INTERVAL = 500;
    const SOFT_DROP_INTERVAL = 50;
    const SCORE_PER_PUYO = 10;

    const app = document.querySelector('#app');
    app.innerHTML = `
      <div class="game-shell">
        <header class="topbar">
          <h1>Puyo Puyo</h1>
          <button id="restart">Restart</button>
        </header>
        <main class="layout">
          <div class="board-wrap">
            <canvas id="board" width="${COLS * CELL}" height="${ROWS * CELL}"></canvas>
          </div>
          <aside class="panel">
            <section><h2>Score</h2><div id="score">0</div></section>
            <section><h2>Chain</h2><div id="chain">0</div></section>
            <section><h2>Next</h2><canvas id="next" width="96" height="96"></canvas></section>
            <section class="help">
              <p>Move: ← →</p>
              <p>Rotate: ↑ / X</p>
              <p>Soft drop: ↓</p>
              <p>Hard drop: Space</p>
              <p>Restart: R</p>
            </section>
          </aside>
        </main>
        <div id="message" class="message hidden"></div>
      </div>
    `;

    const boardCanvas = document.querySelector('#board');
    const boardCtx = boardCanvas.getContext('2d');
    const nextCanvas = document.querySelector('#next');
    const nextCtx = nextCanvas.getContext('2d');
    const scoreEl = document.querySelector('#score');
    const chainEl = document.querySelector('#chain');
    const messageEl = document.querySelector('#message');
    const restartBtn = document.querySelector('#restart');

    let board, current, nextPiece, score, chain, gameOver, lastDrop, softDrop = false;

    function emptyBoard() { return Array.from({ length: ROWS }, () => Array(COLS).fill(null)); }
    function randColor() { return COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)]; }
    function makePiece() {
      const a = randColor();
      let b = randColor();
      while (b === a) b = randColor();
      return { x: 2, y: 0, rot: 0, colors: [a, b], hue: Math.random() * Math.PI * 2 };
    }
    function cellsFor(piece) {
      const offsets = [
        [{ x: 0, y: 0 }, { x: 0, y: -1 }],
        [{ x: 0, y: 0 }, { x: 1, y: 0 }],
        [{ x: 0, y: 0 }, { x: 0, y: 1 }],
        [{ x: 0, y: 0 }, { x: -1, y: 0 }],
      ][piece.rot];
      return offsets.map((o, i) => ({ x: piece.x + o.x, y: piece.y + o.y, color: piece.colors[i], index: i }));
    }
    function valid(piece) { return cellsFor(piece).every(({ x, y }) => x >= 0 && x < COLS && y < ROWS && (y < 0 || !board[y][x])); }
    function spawn() {
      current = nextPiece ?? makePiece();
      nextPiece = makePiece();
      current.x = 2; current.y = 0; current.rot = 0;
      if (!valid(current)) { gameOver = true; messageEl.textContent = 'Game Over'; messageEl.classList.remove('hidden'); }
    }
    function placeCurrent() { cellsFor(current).forEach(({ x, y, color }) => { if (y >= 0) board[y][x] = color; }); }
    function applyGravity() {
      let moved = false;
      for (let y = ROWS - 2; y >= 0; y--) for (let x = 0; x < COLS; x++) if (board[y][x] && !board[y + 1][x]) { board[y + 1][x] = board[y][x]; board[y][x] = null; moved = true; }
      return moved;
    }
    function findGroups() {
      const visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
      const groups = [];
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (!board[y][x] || visited[y][x]) continue;
          const color = board[y][x];
          const stack = [[x, y]];
          const group = [];
          visited[y][x] = true;
          while (stack.length) {
            const [cx, cy] = stack.pop();
            group.push([cx, cy]);
            for (const [dx, dy] of dirs) {
              const nx = cx + dx, ny = cy + dy;
              if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
              if (visited[ny][nx] || board[ny][nx] !== color) continue;
              visited[ny][nx] = true;
              stack.push([nx, ny]);
            }
          }
          if (group.length >= 4) groups.push({ color, cells: group });
        }
      }
      return groups;
    }
    function clearGroups(groups) {
      let cleared = 0;
      for (const group of groups) { cleared += group.cells.length; for (const [x, y] of group.cells) board[y][x] = null; }
      score += cleared * SCORE_PER_PUYO * Math.max(1, chain);
      scoreEl.textContent = score;
      chainEl.textContent = chain;
    }
    function resolveBoard() {
      let localChain = 0;
      while (true) {
        const groups = findGroups();
        if (!groups.length) { if (!applyGravity()) break; continue; }
        localChain += 1;
        chain = localChain;
        clearGroups(groups);
        while (applyGravity()) {}
      }
      chain = 0;
      chainEl.textContent = chain;
    }
    function lockPiece() { placeCurrent(); resolveBoard(); spawn(); }
    function move(dx) { const next = { ...current, x: current.x + dx }; if (valid(next)) current = next; }
    function rotate() {
      const next = { ...current, rot: (current.rot + 1) % 4 };
      const kicks = [0, -1, 1, -2, 2];
      for (const kick of kicks) { const kicked = { ...next, x: next.x + kick }; if (valid(kicked)) { current = kicked; return; } }
    }
    function drop() {
      const next = { ...current, y: current.y + 1 };
      if (valid(next)) { current = next; return true; }
      lockPiece();
      return false;
    }
    function hardDrop() { while (drop()) {} }
    function drawBackground(ctx, w, h, cellSize, rows, cols, preview = false) {
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, preview ? '#11192a' : '#121b2d');
      bg.addColorStop(1, preview ? '#0b1220' : '#0e1522');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,.045)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= cols; x++) { ctx.beginPath(); ctx.moveTo(x * cellSize + 0.5, 0); ctx.lineTo(x * cellSize + 0.5, h); ctx.stroke(); }
      for (let y = 0; y <= rows; y++) { ctx.beginPath(); ctx.moveTo(0, y * cellSize + 0.5); ctx.lineTo(w, y * cellSize + 0.5); ctx.stroke(); }
      ctx.restore();
    }
    function drawPuyo(ctx, cx, cy, colorName, size, opts = {}) {
      const palette = COLORS[colorName];
      const x = cx * size + size / 2;
      const y = cy * size + size / 2;
      const r = size * 0.42;
      const body = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.15, x, y, r);
      body.addColorStop(0, '#ffffff');
      body.addColorStop(0.12, palette.fill);
      body.addColorStop(1, palette.stroke);
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.3)';
      ctx.shadowBlur = 6;
      ctx.shadowOffsetY = 2;
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.lineWidth = Math.max(1.5, size * 0.06);
      ctx.strokeStyle = 'rgba(255,255,255,.28)';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x, y, r * 0.92, 0, Math.PI * 2);
      ctx.clip();
      const shine = ctx.createRadialGradient(x - r * 0.38, y - r * 0.42, r * 0.05, x - r * 0.12, y - r * 0.18, r * 0.95);
      shine.addColorStop(0, 'rgba(255,255,255,.95)');
      shine.addColorStop(0.16, palette.highlight);
      shine.addColorStop(0.33, 'rgba(255,255,255,0)');
      ctx.fillStyle = shine;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      ctx.beginPath();
      ctx.arc(x + r * 0.22, y + r * 0.18, r * 0.55, Math.PI * 1.1, Math.PI * 1.95);
      ctx.fill();
      ctx.restore();
      const eyeY = y - r * 0.05;
      const eyeX = r * 0.22;
      const eyeR = r * 0.14;
      const pupilR = eyeR * 0.42;
      const facing = opts.index === 0 ? -1 : 1;
      const blink = opts.blink || 1;
      function eye(px) {
        ctx.save();
        ctx.translate(px, eyeY);
        ctx.scale(1, blink);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, eyeR, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = palette.eye;
        ctx.beginPath();
        ctx.arc(facing * eyeR * 0.12, eyeR * 0.06, pupilR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      eye(x - eyeX);
      eye(x + eyeX);
      ctx.fillStyle = palette.eye;
      ctx.beginPath();
      ctx.arc(x, y + r * 0.2, r * 0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = palette.eye;
      ctx.lineWidth = Math.max(1.1, size * 0.035);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(x, y + r * 0.16, r * 0.18, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }
    function renderBoard() {
      drawBackground(boardCtx, boardCanvas.width, boardCanvas.height, CELL, ROWS, COLS, false);
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (board[y][x]) drawPuyo(boardCtx, x, y, board[y][x], CELL);
      if (current && !gameOver) for (const c of cellsFor(current)) if (c.y >= 0) drawPuyo(boardCtx, c.x, c.y, c.color, CELL, { index: c.index });
    }
    function renderNext() {
      drawBackground(nextCtx, nextCanvas.width, nextCanvas.height, 24, 4, 4, true);
      const piece = nextPiece;
      if (!piece) return;
      [{ x: 1, y: 1, color: piece.colors[0], index: 0 }, { x: 1, y: 2, color: piece.colors[1], index: 1 }].forEach(({ x, y, color, index }) => drawPuyo(nextCtx, x, y, color, 24, { index }));
    }
    function loop(timestamp) {
      if (!lastDrop) lastDrop = timestamp;
      const interval = softDrop ? SOFT_DROP_INTERVAL : DROP_INTERVAL;
      if (!gameOver && timestamp - lastDrop >= interval) { drop(); lastDrop = timestamp; }
      renderBoard(); renderNext(); requestAnimationFrame(loop);
    }
    function reset() {
      board = emptyBoard(); current = null; nextPiece = makePiece(); score = 0; chain = 0; gameOver = false; lastDrop = 0; softDrop = false;
      messageEl.classList.add('hidden'); scoreEl.textContent = score; chainEl.textContent = chain; spawn();
    }
    window.addEventListener('keydown', (e) => {
      if (gameOver && e.key !== 'Enter') return;
      if (e.key === 'ArrowLeft') move(-1);
      if (e.key === 'ArrowRight') move(1);
      if (e.key === 'ArrowUp' || e.key === 'x' || e.key === 'X') rotate();
      if (e.key === 'ArrowDown') softDrop = true;
      if (e.key === ' ') { e.preventDefault(); hardDrop(); }
      if (e.key === 'r' || e.key === 'R') reset();
    });
    window.addEventListener('keyup', (e) => { if (e.key === 'ArrowDown') softDrop = false; });
    restartBtn.addEventListener('click', reset);
    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
